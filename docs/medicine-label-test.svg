  </text>

  <g transform="translate(120,650)">
    <rect x="0" y="0" width="1100" height="64" rx="18" fill="#ffffff" stroke="#d9dee7" stroke-width="3"/>
    <text x="34" y="42" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="28" fill="#4b5563">
