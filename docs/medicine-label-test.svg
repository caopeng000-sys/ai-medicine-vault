<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#ffffff"/>
  <rect x="70" y="60" width="1260" height="180" rx="28" fill="#eef6ff" stroke="#c7d8f2" stroke-width="4"/>
  <rect x="70" y="270" width="1260" height="560" rx="28" fill="#fafafa" stroke="#d9dee7" stroke-width="4"/>

  <text x="120" y="135" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#173d73">
    布洛芬缓释胶囊
  </text>
  <text x="120" y="195" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#2f5f99">
    0.3g/粒
  </text>

  <g transform="translate(930,105)">
    <rect x="0" y="0" width="76" height="36" rx="18" fill="#61b7ff"/>
    <rect x="90" y="0" width="76" height="36" rx="18" fill="#ff7d7d"/>
    <rect x="180" y="0" width="76" height="36" rx="18" fill="#8bd18b"/>
    <rect x="270" y="0" width="76" height="36" rx="18" fill="#ffd166"/>
  </g>

  <text x="120" y="350" font-family="PingFang SC, Helvetica, Arial, sans-serif" font-size="32" fill="#333333">
