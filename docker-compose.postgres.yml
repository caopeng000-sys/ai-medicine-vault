services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-medicine-vault-postgres
    environment:
      POSTGRES_DB: ai_medicine_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ai_medicine_vault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_medicine_vault"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ai_medicine_vault_postgres_data:
